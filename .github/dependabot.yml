version: 2
# GitHub Packages uses Dependabot's automatic GITHUB_TOKEN authentication.
# Registry routing for @icco stays in .npmrc.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
